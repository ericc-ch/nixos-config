title = "nixos-config gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "cursor-api-key"
description = "Cursor API key"
regex = '''\b(crsr_[A-Za-z0-9_-]{40,})\b'''
secretGroup = 1
keywords = ["crsr_"]

# Vendored web-guidance guides quote WebCrypto examples that name a hybrid
# key-encapsulation algorithm. Its name trips the generic-api-key entropy
# rule, so allow that one exact string rather than the guides tree.
[allowlist]
description = "Crypto algorithm names in vendored WebCrypto examples"
regexes = ['''MLKEM768-X25519''']

[[rules]]
id = "modal-proxy-token"
description = "Modal proxy websocket token"
regex = '''\b(wk-[A-Za-z0-9]+\.ws-[A-Za-z0-9_-]+)\b'''
secretGroup = 1
keywords = ["wk-"]
