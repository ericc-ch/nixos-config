# Machine-local cargo settings.
#
# Deliberately no build.target-dir: mbx (mr boxington) owns the target
# directory now. It keeps a managed target per checkout under
# /mnt/ssd/mbx/targets, leaves a `target` symlink in the checkout, and collects
# unused ones under the budget in dotfiles/.config/mbx/config.toml. Setting
# build.target-dir here would turn that off.
#
# Plain `cargo` goes through mbx via the mise rust tool option
# (dotfiles/.config/mise/config.toml). Run `mise doctor` or `command -v cargo`
# if a build ever writes an unlinked ./target.
