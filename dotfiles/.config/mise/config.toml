# mise global config — editable, synced to ~/.config/mise/config.toml via symlink
#:schema https://mise.jdx.dev/schema/mise.json

[settings]
minimum_release_age = "2h"

[settings.node]
# mise compiles from source by default on NixOS; nix-ld makes prebuilt
# binaries work, so use them instead
compile = false

[tools]
node = "26"
deno = "2"
bun = "1"
nub = "latest"

go = "1"

# mr_boxington wraps every cargo the mise rust tool provides with mbx (shared
# build cache). See dotfiles/.config/mbx/config.toml for the store location.
rust = { version = "1", mr_boxington = true }
mr-boxington = "latest"

pnpm = "latest"
aube = "latest"

"npm:@opencode/cli" = { version = "latest", allow_builds = true }
"npm:@earendil-works/pi-coding-agent" = "latest"

"pipx:hf" = "latest"
"pipx:kaggle" = "latest"
"pipx:oci-cli" = "latest"

"go:golang.org/x/tools/gopls" = "latest"
"npm:@openai/codex" = "latest"
# Executor's v2 betas are hand-published by the maintainer with no SLSA
# provenance, so trust policy rejects them; the site itself only ships
# `executor@beta`. Exempted for the whole package on purpose: every beta bump
# would otherwise need a new exclusion. The npm tarball is a launcher that
# SHA-256 pins the GitHub release archive it downloads.
"npm:executor" = { version = "beta", trust_policy_excludes = ["executor"] }
