# Gruvbox Dark Hard
# Definitive source: https://github.com/morhetz/gruvbox/blob/master/colors/gruvbox.vim
# Commit: 697c00291db857ca0af00ec154e5bd514a79191f
#
# Dark hard is selected with g:gruvbox_contrast_dark = 'hard' (default is 'medium').
# Only bg0 differs from medium: dark0_hard (#1d2021) instead of dark0 (#282828).

