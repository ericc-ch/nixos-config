# Semantic colors when background=dark and g:gruvbox_contrast_dark=hard
dark_hard:
  bg0: "#1d2021" # dark0_hard
  bg1: "#3c3836" # dark1
  bg2: "#504945" # dark2
  bg3: "#665c54" # dark3
  bg4: "#7c6f64" # dark4

  gray: "#928374" # gray_245

  fg0: "#fbf1c7" # light0
